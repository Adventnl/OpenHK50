[package]
name = "openh-k50-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
btleplug = "0.13.5"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
openh-k50-protocol = { path = "../protocol", features = ["activity", "backup"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
strip = true
