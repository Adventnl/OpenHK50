pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        google()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven { url = uri('https://jitpack.io') }
            }
            filter { includeModule('com.github.QWEA0', 'liquidglass') }
        }
    }
}
rootProject.name = 'OpenHK50'
include ':app'
