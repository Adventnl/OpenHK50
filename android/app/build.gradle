plugins {
    id 'com.android.application' version '9.3.1'
}

def rustSource = rootProject.layout.projectDirectory.dir('../protocol')
def localProperties = new Properties()
providers.fileContents(rootProject.layout.projectDirectory.file('local.properties')).asText.orNull?.with {
    localProperties.load(new StringReader(it))
}
def workoutWeightKg = localProperties.getProperty('openhk50.workout.weightKg')?.toDouble()
def workoutBodyFatPercent = localProperties.getProperty('openhk50.workout.bodyFatPercent')?.toDouble()
def measuredBasalKcal = localProperties.getProperty('openhk50.workout.basalKcalPerDay')?.toDouble()
if (measuredBasalKcal != null && !(measuredBasalKcal > 0 && measuredBasalKcal <= 10_000)) {
    throw new GradleException('Set a valid daily BMR in android/local.properties.')
}
if ((workoutWeightKg != null || workoutBodyFatPercent != null) &&
        !(workoutWeightKg > 0 && workoutWeightKg <= 400 && workoutBodyFatPercent > 0 && workoutBodyFatPercent < 100)) {
    throw new GradleException('Set a valid weight in kg and body fat percentage together in android/local.properties.')
}

abstract class BuildRust extends Exec {
    @OutputDirectory
    abstract DirectoryProperty getLibraries()
}

android {
    namespace 'org.openhk50'
    compileSdk 36
    ndkVersion '28.2.13676358'

    buildFeatures.buildConfig = true

    defaultConfig {
        applicationId 'org.openhk50'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
        ndk.abiFilters 'arm64-v8a', 'x86_64'
        buildConfigField 'Double', 'WORKOUT_WEIGHT_KG', workoutWeightKg?.toString() ?: 'null'
        buildConfigField 'Double', 'WORKOUT_BODY_FAT_PERCENT', workoutBodyFatPercent?.toString() ?: 'null'
        buildConfigField 'Double', 'MEASURED_BASAL_KCAL', measuredBasalKcal?.toString() ?: 'null'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.8.1'
    implementation 'androidx.camera:camera-camera2:1.5.1'
    implementation 'androidx.camera:camera-lifecycle:1.5.1'
    implementation 'androidx.camera:camera-view:1.5.1'
    implementation 'no.nordicsemi.android:ble:2.11.0'
    testImplementation 'junit:junit:4.13.2'
}

def ndkPath = androidComponents.sdkComponents.ndkDirectory
def rustBuild = tasks.register('buildRust', BuildRust) {
    inputs.files(rustSource.file('Cargo.toml'), rustSource.file('Cargo.lock'))
    inputs.dir(rustSource.dir('src'))
    libraries.set(layout.buildDirectory.dir('generated/jniLibs'))
    workingDir rustSource
    doFirst {
        environment 'ANDROID_NDK_HOME', ndkPath.get().asFile.absolutePath
        commandLine 'cargo', 'ndk', '-t', 'arm64-v8a', '-t', 'x86_64', '--platform', '26',
                '-o', libraries.get().asFile.absolutePath, 'build', '--release', '--locked', '--features', 'android'
    }
}
androidComponents.onVariants(androidComponents.selector().all(), { variant ->
    variant.sources.jniLibs.addGeneratedSourceDirectory(rustBuild) { it.libraries }
} as Action)
